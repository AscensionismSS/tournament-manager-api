services:
  postgres:
    image: postgres:17-alpine
    container_name: tournament_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-TournamentEngineDb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-TournamentEngineDb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tournament_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-5000}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ConnectionStrings__TournamentsDatabase=Host=postgres;Port=5432;Database=${POSTGRES_DB:-TournamentEngineDb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - Jwt__SecretKey=${JWT_SECRET_KEY:-TournamentCreatorSecretKeySuperSecureMinimum256BitsLong2026!}
      - Jwt__Issuer=${JWT_ISSUER:-TournamentCreator}
      - Jwt__Audience=${JWT_AUDIENCE:-TournamentCreatorApp}
      - Jwt__ExpiryMinutes=${JWT_EXPIRY_MINUTES:-480}
      - Cors__AllowedOrigins=${CORS_ALLOWED_ORIGINS:-*}
      - Swagger__Enabled=${SWAGGER_ENABLED:-true}
      - Database__InitializeOnStartup=true
      - AdminSeed__Email=${ADMIN_SEED_EMAIL:-admin@tournament.local}
      - AdminSeed__Password=${ADMIN_SEED_PASSWORD:-Admin123!}
      - ReplayParser__ExecutablePath=/app/tools/ParseGoDota/parsegodota
    volumes:
      - api_uploads:/app/wwwroot/uploads

  adminer:
    image: adminer:latest
    container_name: tournament_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8088}:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
  api_uploads:
